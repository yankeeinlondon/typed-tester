<body style="background: lightgrey">
    <div id="container" style="width: 800px; height: 600px; background: white"></div>
    <script type="module">
        const symbols = JSON.parse(document.getElementById("symbols-data").textContent);
        // Create a graphology graph
        const graph = new graphology.Graph();

        for (const node of symbols) {
            graph.addNode(node.fqn, { label: node.name, size: node.deps.length > 5 ? 20 : 10, color: "gray"});
        }
    
        for (const node of symbols) {
            for (const dep of node.deps) {
                if (dep.scope !== "external") {
                    console.log("edge", dep, node)
                    graph.addEdge(node.fqn, dep.fqn, { size: 5, color: "purple" })
                }
            }
        }

        // Instantiate sigma.js and render the graph
        const sigmaInstance = new Sigma(graph, document.getElementById("container"));
    </script>
