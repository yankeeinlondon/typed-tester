name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  wait-and-check:
    name: Wait and Check Latest
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.check.outputs.should-publish }}
      current-tag: ${{ steps.check.outputs.current-tag }}
      latest-tag: ${{ steps.check.outputs.latest-tag }}
    steps:
      - name: Wait for other tags
        run: |
          echo "⏱️ Waiting 30 seconds for any other tags to be pushed..."
          sleep 30
          
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Check if this is the latest tag
        id: check
        run: |
          # Get current tag from the workflow trigger
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          echo "Current workflow tag: $CURRENT_TAG"
          
          # Fetch all tags from remote to ensure we have everything
          git fetch --tags --force origin
          
          # Get all version tags and find the highest one
          LATEST_TAG=$(git tag -l 'v*' | sort -V | tail -1)
          echo "Latest tag in repository: $LATEST_TAG"
          
          # Output values
          echo "current-tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          echo "latest-tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          if [ "$CURRENT_TAG" = "$LATEST_TAG" ]; then
            echo "✅ This IS the latest tag - will proceed with publish"
            echo "should-publish=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ Skipping - $CURRENT_TAG is older than $LATEST_TAG"
            echo "should-publish=false" >> $GITHUB_OUTPUT
          fi

  test:
    name: test
    needs: [wait-and-check]
    if: needs.wait-and-check.outputs.should-publish == 'true'
    uses: yankeeinlondon/gha/.github/workflows/test.yml@main
    with:
      os: '["ubuntu-latest"]'
      nodeVersion: '["22.x"]'
      
  publish:
    name: publish
    needs: [wait-and-check, test]
    if: needs.wait-and-check.outputs.should-publish == 'true'
    uses: yankeeinlondon/gha/.github/workflows/publish.yml@main
    with:
      jsr_scope: '@yankeeinlondon'
      github_packages_scope: '@yankeeinlondon'
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      
  skip-message:
    name: Skipped Older Version
    needs: [wait-and-check]
    if: needs.wait-and-check.outputs.should-publish == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Report Skip
        run: |
          echo "📦 Skipped publishing ${{ needs.wait-and-check.outputs.current-tag }}"
          echo "ℹ️ Latest version is ${{ needs.wait-and-check.outputs.latest-tag }}"
          echo "✅ Only the latest version will be published"
