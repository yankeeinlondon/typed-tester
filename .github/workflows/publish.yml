name: Publish

# Use concurrency to ensure only one publish job runs at a time
# This prevents race conditions when multiple tags are pushed
concurrency:
  group: publish
  cancel-in-progress: false  # Queue them, don't cancel

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: test
    uses: yankeeinlondon/gha/.github/workflows/test.yml@main
    with:
      os: '["ubuntu-latest"]'
      nodeVersion: '["22.x"]'
      
  publish:
    name: publish
    needs: [test]
    uses: yankeeinlondon/gha/.github/workflows/publish.yml@main
    with:
      jsr_scope: '@yankeeinlondon'
      github_packages_scope: '@yankeeinlondon'
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
