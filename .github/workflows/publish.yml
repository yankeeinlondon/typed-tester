name: Publish

# Use concurrency to prevent simultaneous publishes
# Combined with latest-check to skip older versions
concurrency:
  group: publish
  cancel-in-progress: true  # Cancel older workflows when newer one starts

on:
  push:
    tags:
      - 'v*'

jobs:
  check-latest:
    name: Check Latest Version
    runs-on: ubuntu-latest
    outputs:
      is-latest: ${{ steps.check.outputs.is-latest }}
      current-tag: ${{ steps.check.outputs.current-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Determine if this is the latest tag
        id: check
        run: |
          # Get current tag
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          echo "Current tag: $CURRENT_TAG"
          
          # Get all tags and find the highest version
          # This ensures we have all remote tags
          git fetch --tags origin
          
          # List all v* tags and sort by version
          ALL_TAGS=$(git tag -l 'v*' | tr -d 'v' | sort -V | tail -1)
          LATEST_TAG="v${ALL_TAGS}"
          
          echo "Latest tag: $LATEST_TAG"
          echo "current-tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          
          if [ "$CURRENT_TAG" = "$LATEST_TAG" ]; then
            echo "✅ This is the latest version - will publish"
            echo "is-latest=true" >> $GITHUB_OUTPUT
          else
            echo "⏩ Skipping older version $CURRENT_TAG (latest is $LATEST_TAG)"
            echo "is-latest=false" >> $GITHUB_OUTPUT
          fi

  test:
    name: test
    needs: [check-latest]
    if: needs.check-latest.outputs.is-latest == 'true'
    uses: yankeeinlondon/gha/.github/workflows/test.yml@main
    with:
      os: '["ubuntu-latest"]'
      nodeVersion: '["22.x"]'
      
  publish:
    name: publish
    needs: [check-latest, test]
    if: needs.check-latest.outputs.is-latest == 'true'
    uses: yankeeinlondon/gha/.github/workflows/publish.yml@main
    with:
      jsr_scope: '@yankeeinlondon'
      github_packages_scope: '@yankeeinlondon'
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      
  skip-notice:
    name: Skipped Older Version
    needs: [check-latest]
    if: needs.check-latest.outputs.is-latest == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Report Skip
        run: |
          echo "📦 Skipped publishing ${{ needs.check-latest.outputs.current-tag }} - not the latest version"
          echo "ℹ️ Only the latest version tag will be published to avoid conflicts"
