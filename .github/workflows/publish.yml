name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  check-and-publish:
    name: Check Version and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          
      - name: Get Version Info
        id: version
        run: |
          # Get current tag
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          
          # Strip 'v' prefix for comparison
          CURRENT_VERSION="${CURRENT_TAG#v}"
          echo "Current version: $CURRENT_VERSION"
          
          # Fetch all remote tags
          git fetch --tags --force origin
          
          # Get the highest version tag
          LATEST_VERSION=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
          echo "Latest version in repo: $LATEST_VERSION"
          
          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "✅ Version $CURRENT_VERSION is the latest - proceeding with publish"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ Skipping version $CURRENT_VERSION - latest is $LATEST_VERSION"
            echo "should_publish=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
      - name: Exit if not latest
        if: steps.version.outputs.should_publish != 'true'
        run: |
          echo "🚫 Workflow stopping - not the latest version"
          exit 0

  test:
    name: test
    needs: [check-and-publish]
    if: success()
    uses: yankeeinlondon/gha/.github/workflows/test.yml@main
    with:
      os: '["ubuntu-latest"]'
      nodeVersion: '["22.x"]'
      
  publish:
    name: publish
    needs: [test]
    if: success()
    uses: yankeeinlondon/gha/.github/workflows/publish.yml@main
    with:
      jsr_scope: '@yankeeinlondon'
      github_packages_scope: '@yankeeinlondon'
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
