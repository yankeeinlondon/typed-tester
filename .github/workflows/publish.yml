name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (optional - will use latest if not specified)'
        required: false
        type: string

jobs:
  check-latest:
    name: Check Latest Version
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.check.outputs.should-publish }}
      tag-to-publish: ${{ steps.check.outputs.tag-to-publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          
      - name: Wait for other tags (on push only)
        if: github.event_name == 'push'
        run: |
          echo "⏱️ Waiting 10 seconds for any other tags to arrive..."
          sleep 10
          
      - name: Determine if we should publish
        id: check
        run: |
          # Fetch all tags to ensure we have everything
          git fetch --tags --force origin
          
          # Determine what tag to check based on trigger type
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            CURRENT_TAG="${{ inputs.tag }}"
            echo "📌 Manual trigger for specific tag: $CURRENT_TAG"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger without tag - use latest
            CURRENT_TAG=$(git tag -l 'v*' | sort -V | tail -1)
            echo "📌 Manual trigger - using latest tag: $CURRENT_TAG"
          else
            # Push event - use the tag that triggered it
            CURRENT_TAG="${GITHUB_REF#refs/tags/}"
            echo "📌 Triggered by tag push: $CURRENT_TAG"
          fi
          
          # Get the latest version tag
          LATEST_TAG=$(git tag -l 'v*' | sort -V | tail -1)
          echo "📊 Latest tag in repository: $LATEST_TAG"
          
          # For manual dispatch, always publish the requested tag
          # For push events, only publish if it's the latest
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "✅ Manual trigger - will publish $CURRENT_TAG"
            echo "should-publish=true" >> $GITHUB_OUTPUT
            echo "tag-to-publish=$CURRENT_TAG" >> $GITHUB_OUTPUT
          elif [ "$CURRENT_TAG" = "$LATEST_TAG" ]; then
            echo "✅ This is the latest tag - will publish"
            echo "should-publish=true" >> $GITHUB_OUTPUT
            echo "tag-to-publish=$LATEST_TAG" >> $GITHUB_OUTPUT
          else
            echo "⏭️ Skipping - $CURRENT_TAG is not the latest (latest is $LATEST_TAG)"
            echo "should-publish=false" >> $GITHUB_OUTPUT
            echo "tag-to-publish=$CURRENT_TAG" >> $GITHUB_OUTPUT
          fi

  test:
    name: test
    needs: [check-latest]
    if: needs.check-latest.outputs.should-publish == 'true'
    uses: yankeeinlondon/gha/.github/workflows/test.yml@main
    with:
      os: '["ubuntu-latest"]'
      nodeVersion: '["22.x"]'
      
  publish:
    name: publish
    needs: [check-latest, test]
    if: needs.check-latest.outputs.should-publish == 'true'
    uses: yankeeinlondon/gha/.github/workflows/publish.yml@main
    with:
      jsr_scope: '@yankeeinlondon'
      github_packages_scope: '@yankeeinlondon'
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      
  skip-notice:
    name: Skipped Older Version
    needs: [check-latest]
    if: needs.check-latest.outputs.should-publish == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Report Skip
        run: |
          echo "📦 Skipped publishing ${{ needs.check-latest.outputs.tag-to-publish }}"
          echo "ℹ️ Only the latest version publishes automatically"
          echo "💡 To force publish an older version, use manual workflow dispatch"
