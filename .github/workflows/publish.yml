name: Publish
on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: test
    uses: yankeeinlondon/gha/.github/workflows/test.yml@main
    with:
      os: '["ubuntu-latest"]'
      nodeVersion: '["22.x"]'
  publish:
    name: publish
    needs: [test]
    uses: yankeeinlondon/gha/.github/workflows/publish.yml@main
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
