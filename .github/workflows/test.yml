name: Testing

on:
  push:
    branches: [main]

jobs:
  test:
    name: testing
    if: |
      !startsWith(github.event.head_commit.message, 'chore: release') &&
      !startsWith(github.event.head_commit.message, 'chore(release)')
    uses: yankeeinlondon/gha/.github/workflows/test.yml@main
    with:
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      nodeVersion: '["22.x"]'
