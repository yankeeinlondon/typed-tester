name: Testing

on:
  push:
    branches: [main]

jobs:
  test:
    name: testing
    if: |
      !startsWith(github.ref, 'refs/tags/v')
    uses: yankeeinlondon/gha/.github/workflows/test.yml@main
    with:
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      nodeVersion: '["22.x"]'
  
  notify-skipped:
    name: notify
    if: |
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Reason
        run: |
          echo "::notice title=Testing Skipped::📦 Testing skipped because this is a version release. A separate action should test and publish (if testing is successful)."
